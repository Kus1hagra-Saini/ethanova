[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethanova-simulator"
version = "0.1.0"
description = "Historical data simulator for Ethanova's E20 supply chain platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0.30,<3.0",
    "psycopg2-binary>=2.9.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.scripts]
ethanova-simulator = "ethanova_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]