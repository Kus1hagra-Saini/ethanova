name: ethanova

services:
  postgres:
    image: postgres:16-alpine
    container_name: ethanova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ethanova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ethanova_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-ethanova}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ethanova} -d ${POSTGRES_DB:-ethanova}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ethanova-net

volumes:
  postgres_data:
    name: ethanova_postgres_data

networks:
  ethanova-net:
    name: ethanova-net
    driver: bridge